name: Master Arise Jago Sync

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Type "Arise Jago" to wake up the factory'
        required: true
        default: 'Arise Jago'

jobs:
  master-wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install google-generativeai

      - name: Run Master Core Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRIGGER_COMMAND: "${{ github.event.inputs.command }}"
        run: python mother_factory_core.py

      - name: Commit & Push Synchronized Memory
        run: |
          git config --global user.name "Mother Factory Master"
          git config --global user.email "master@factory.local"
          git add factory_memory.json
          git commit -m "⚡ Arise Jago: Mother Factory awakened and memory synchronized" || echo "No changes"
          git push
          
