name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            autoconf \
            libtool \
            pkg-config \
            libncurses5-dev \
            libstdc++6 \
            libz1 \
            unzip \
            ant \
            libltdl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36
        pip install --upgrade buildozer

    - name: Initialize and Configure Buildozer Spec
      run: |
        buildozer init || true
        sed -i 's/# title = My Application/title = Mr. Sky Sentinel/' buildozer.spec
        sed -i 's/# package.name = myapp/package.name = mrsky/' buildozer.spec
        sed -i 's/# package.domain = org.test/package.domain = org.mrsky/' buildozer.spec
        sed -i 's/# requirements = python3,kivy/requirements = python3,kivy/' buildozer.spec
        sed -i 's/# orientation = portrait/orientation = portrait/' buildozer.spec
        sed -i 's/# android.permissions = INTERNET/android.permissions = INTERNET/' buildozer.spec
        sed -i 's/# android.api = 33/android.api = 33/' buildozer.spec
        sed -i 's/# android.minapi = 21/android.minapi = 21/' buildozer.spec
        sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec

    - name: Manual Setup Android SDK and Command-Line Tools
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
        unzip -q cmdtools.zip -d temp_tools
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        mv temp_tools/cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/
        rm -rf cmdtools.zip temp_tools

        # Accept all SDK licenses automatically
        mkdir -p $ANDROID_HOME/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a64810" >> $ANDROID_HOME/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license

        # Pre-accept licenses using sdkmanager
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        yes | sdkmanager --licenses || true

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mr-sky-apk
        path: bin/*.apk
